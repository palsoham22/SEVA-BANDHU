{% extends 'admin_custom/base_admin.html' %}

{% block content %}
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
        <div>
            <h1>{{ action }} Service Category</h1>
            <p style="color:#64748b; font-size:14px; margin:0;">Define service title, base pricing, thumbnail asset, and catalog visibility.</p>
        </div>
        <a href="{% url 'admin_services_list' %}" class="btn btn-secondary">← Back to Services</a>
    </div>

    <div style="background:#ffffff; border:1px solid #e2e8f0; border-radius:16px; padding:28px; box-shadow:0 2px 8px rgba(15,23,42,0.02); max-width: 640px;">
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div style="margin-bottom: 20px;">
                <label style="display:block; font-size:13px; font-weight:700; color:#334155; margin-bottom:6px;">Service Name</label>
                <input type="text" id="name" name="name" value="{{ service.name }}" placeholder="e.g. Electrical Repair & Installation" required style="width:100%; padding:11px 14px; border:1px solid #cbd5e1; border-radius:8px; font-size:14px;">
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display:block; font-size:13px; font-weight:700; color:#334155; margin-bottom:6px;">Standard Rate (₹)</label>
                <input type="number" id="price" name="price" value="{{ service.price }}" placeholder="e.g. 499" required style="width:100%; padding:11px 14px; border:1px solid #cbd5e1; border-radius:8px; font-size:14px;">
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display:block; font-size:13px; font-weight:700; color:#334155; margin-bottom:6px;">Service Thumbnail Image</label>
                {% if service.image %}
                    <div style="margin-bottom: 12px;">
                        <img src="{{ service.image.url }}" alt="{{ service.name }}" style="width: 120px; height:80px; object-fit:cover; border-radius: 8px; border:1px solid #e2e8f0;">
                    </div>
                {% endif %}
                <input type="file" id="image" name="image" accept="image/*" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; background:#f8fafc;">
            </div>

            <div style="display: flex; align-items: center; gap: 10px; margin-bottom:28px; background:#f8fafc; padding:14px; border-radius:10px; border:1px solid #e2e8f0;">
                <input type="checkbox" id="is_enabled" name="is_enabled" {% if action == 'Add' or service.is_enabled %}checked{% endif %} style="width: 18px; height: 18px;">
                <label for="is_enabled" style="margin-bottom: 0; font-size:13.5px; font-weight:600; color:#0f172a; cursor:pointer;">
                    Is Active (Visible to customers for service request bookings)
                </label>
            </div>

            <div>
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 14.5px; font-weight:700;">
                    Save Service Category
                </button>
            </div>
        </form>
    </div>
{% endblock %}
