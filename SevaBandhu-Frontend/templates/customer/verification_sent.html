<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check your email | Seva Bandhu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            min-height: 100vh;
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: #0f172a;
        }
        .card {
            max-width: 480px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 28px;
            border: 2px solid #ffffff;
            padding: 44px 36px;
            box-shadow: 0 20px 45px -10px rgba(37, 99, 235, 0.12);
            text-align: center;
        }
        .mail-icon-box {
            width: 72px;
            height: 72px;
            border-radius: 22px;
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            color: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            box-shadow: 0 10px 20px -4px rgba(37, 99, 235, 0.25);
        }
        h1 { font-family: 'Outfit', sans-serif; font-size: 28px; font-weight: 800; margin-bottom: 12px; }
        p { font-size: 15px; color: #64748b; line-height: 1.65; margin-bottom: 20px; }
        .email-highlight { color: #2563eb; font-weight: 700; word-break: break-all; }
        button {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 14.5px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: 0.25s ease;
            margin-bottom: 16px;
        }
        button:hover { background: #1d4ed8; }
        a { color: #2563eb; font-weight: 700; text-decoration: none; font-size: 14.5px; }
        a:hover { text-decoration: underline; }
        .status { min-height: 22px; font-size: 13.5px; font-weight: 600; color: #475569; margin-bottom: 14px; }
    </style>
</head>
<body>
    <main class="card">
        <div class="mail-icon-box">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
        </div>
        <h1>Check your inbox</h1>
        <p>We saved your account details and sent a verification code link to <span class="email-highlight">{{ email }}</span>. Open the link from any device or return to sign in.</p>
        <p class="status" id="status"></p>
        <button id="resend">Resend Verification Email</button>
        <p><a href="{% url 'customer_login' %}">← Go to Customer Login</a></p>
    </main>
    <script>
        document.getElementById('resend').onclick = async () => {
            const s = document.getElementById('status');
            s.textContent = 'Sending email…';
            const r = await fetch('{% url "send_verification_email" %}', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}'},
                body: JSON.stringify({email: '{{ email|escapejs }}'})
            });
            const d = await r.json();
            s.textContent = d.message;
        };
    </script>
</body>
</html>
