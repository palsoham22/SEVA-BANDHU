<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Verification | Seva Bandhu</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            min-height: 100vh;
            background-color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
            position: relative;
            overflow-x: hidden;
            color: #0f172a;
        }

        /* Ambient Glowing Background Blobs */
        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.45;
            pointer-events: none;
            z-index: 0;
        }
        .bg-orb-blue { width: 500px; height: 500px; background: #3b82f6; top: -100px; right: -80px; }
        .bg-orb-teal { width: 450px; height: 450px; background: #14b8a6; bottom: -100px; left: -80px; }

        .auth-container {
            width: 100%;
            max-width: 480px;
            position: relative;
            z-index: 1;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 28px;
            border: 2px solid #ffffff;
            padding: 44px 38px;
            box-shadow: 0 20px 45px -10px rgba(37, 99, 235, 0.12), 0 10px 25px -5px rgba(15, 23, 42, 0.06);
            text-align: center;
        }

        .verify-icon-box {
            width: 76px;
            height: 76px;
            border-radius: 24px;
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            color: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            border: 2px solid #bfdbfe;
            box-shadow: 0 10px 20px -4px rgba(37, 99, 235, 0.2);
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 28px;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14.5px;
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .step-card {
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 20px;
            padding: 24px 20px;
            text-align: left;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 700;
            color: #334155;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1.5px solid #cbd5e1;
            font-size: 15px;
            font-family: inherit;
            color: #0f172a;
            background: #ffffff;
            transition: all 0.25s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        .otp-input {
            font-family: 'JetBrains Mono', monospace !important;
            font-size: 18px !important;
            font-weight: 700 !important;
            letter-spacing: 4px;
            text-align: center;
        }

        .btn-send-otp {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 14.5px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 8px 18px -4px rgba(37, 99, 235, 0.35);
        }

        .btn-send-otp:hover {
            background: #1d4ed8;
        }

        .btn-verify-otp {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 14.5px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 8px 18px -4px rgba(16, 185, 129, 0.35);
        }

        .btn-verify-otp:hover {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
        }

        @media (max-width: 520px) {
            .auth-card { padding: 32px 20px; border-radius: 22px; }
            h1 { font-size: 24px; }
        }
    </style>
</head>
<body>

    <div class="bg-orb bg-orb-blue"></div>
    <div class="bg-orb bg-orb-teal"></div>

    <div class="auth-container">
        <div class="auth-card">
            
            <div class="verify-icon-box">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            </div>

            <div id="recaptcha-container"></div>

            <h1>Phone Verification</h1>
            <p class="subtitle">Complete phone OTP verification to finish setting up your account securely.</p>

            <div class="step-card">
                
                <div class="form-group">
                    <label for="phone">1. Enter Mobile Phone Number</label>
                    <input type="text" id="phone" placeholder="+91 98765 43210">
                </div>

                <button onclick="sendOTP()" class="btn-send-otp" style="margin-bottom:20px;">
                    Send Verification OTP
                </button>

                <div class="form-group">
                    <label for="otp">2. Enter 6-Digit OTP Code</label>
                    <input type="text" id="otp" placeholder="123456" class="otp-input">
                </div>

                <button onclick="verifyOTP()" class="btn-verify-otp">
                    Verify OTP &amp; Complete Setup ✓
                </button>

            </div>

        </div>
    </div>

    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, RecaptchaVerifier, signInWithPhoneNumber } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "{{ firebase_config.api_key|escapejs }}",
        authDomain: "{{ firebase_config.auth_domain|escapejs }}",
        projectId: "{{ firebase_config.project_id|escapejs }}",
        storageBucket: "{{ firebase_config.storage_bucket|escapejs }}",
        messagingSenderId: "{{ firebase_config.messaging_sender_id|escapejs }}",
        appId: "{{ firebase_config.app_id|escapejs }}"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.recaptchaVerifier = new RecaptchaVerifier(
        auth,
        'recaptcha-container',
        { size: 'invisible' }
    );

    window.sendOTP = function() {
        const phoneNumber = document.getElementById("phone").value.trim();
        if (!phoneNumber) { alert("Please enter phone number"); return; }
        const appVerifier = window.recaptchaVerifier;

        signInWithPhoneNumber(auth, phoneNumber, appVerifier)
        .then((confirmationResult) => {
            window.confirmationResult = confirmationResult;
            alert("✅ OTP sent successfully to " + phoneNumber);
        })
        .catch((error) => {
            alert(error.message);
        });
    }

    window.verifyOTP = function() {
        const code = document.getElementById("otp").value.trim();
        if (!code) { alert("Please enter OTP code"); return; }

        window.confirmationResult.confirm(code)
        .then((result) => {
            const phone = document.getElementById('phone').value || '';
            const csrftoken = getCookie('csrftoken');

            fetch('/customer/phone-verify-complete/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrftoken
                },
                body: JSON.stringify({ phone: phone })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    window.location.href = '/customer/login/';
                } else {
                    alert('Verification succeeded. Redirecting to login.');
                    window.location.href = '/customer/login/';
                }
            })
            .catch(err => {
                window.location.href = '/customer/login/';
            });
        })
        .catch((error) => {
            alert('Invalid OTP. Please check and try again.');
        });
    }

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
    </script>

</body>
</html>
