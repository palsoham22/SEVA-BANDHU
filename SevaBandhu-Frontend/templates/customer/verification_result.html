<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification | Seva Bandhu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            min-height: 100vh;
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: #0f172a;
        }
        .card {
            max-width: 460px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 28px;
            border: 2px solid #ffffff;
            padding: 44px 36px;
            box-shadow: 0 20px 45px -10px rgba(37, 99, 235, 0.12);
            text-align: center;
        }
        .icon-box {
            width: 72px;
            height: 72px;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }
        .icon-success { background: #dcfce7; color: #16a34a; }
        .icon-error { background: #fee2e2; color: #dc2626; }
        h1 { font-family: 'Outfit', sans-serif; font-size: 26px; font-weight: 800; margin-bottom: 12px; }
        p { font-size: 15px; color: #64748b; line-height: 1.6; margin-bottom: 24px; }
        a {
            display: inline-block;
            width: 100%;
            padding: 14px 20px;
            border-radius: 14px;
            background: #2563eb;
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
            transition: background 0.25s ease;
        }
        a:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <main class="card">
        <div class="icon-box {% if success %}icon-success{% else %}icon-error{% endif %}">
            {% if success %}
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
            {% else %}
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            {% endif %}
        </div>
        <h1>{% if success %}Email Verified Successfully{% else %}Verification Link Expired{% endif %}</h1>
        <p>{{ message }}</p>
        <a href="{% url 'customer_login' %}">Go to Customer Login →</a>
    </main>
</body>
</html>
