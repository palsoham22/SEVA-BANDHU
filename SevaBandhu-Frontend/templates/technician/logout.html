<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logged Out | Technician Partner</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;
    font-family: 'Inter', system-ui, sans-serif;
    background: #f8fafc;
    color: #0f172a;
}

.container {
    width: 100%;
    max-width: 480px;
    text-align: center;
    background: #ffffff;
    padding: 48px 36px;
    border-radius: 28px;
    border: 1px solid #e2e8f0;
    box-shadow: 0 10px 30px rgba(15, 23, 42, 0.05);
}

.logout-icon {
    width: 76px;
    height: 76px;
    margin: 0 auto 24px;
    border-radius: 50%;
    background: #eff6ff;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #2563eb;
}

h2 {
    font-family: 'Plus Jakarta Sans', sans-serif;
    color: #0f172a;
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 10px;
    letter-spacing: -0.02em;
}

p {
    color: #64748b;
    font-size: 15px;
    line-height: 1.6;
    margin-bottom: 32px;
}

a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    text-decoration: none;
    background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
    color: #ffffff;
    padding: 14px 26px;
    border-radius: 14px;
    font-size: 14.5px;
    font-weight: 700;
    transition: all 0.25s ease;
    box-shadow: 0 6px 18px rgba(37, 99, 235, 0.25);
}

a:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(37, 99, 235, 0.35);
}
</style>
</head>

<body>

<div class="container">
    <div class="logout-icon">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </div>

    <h2>Logged Out Successfully</h2>
    <p>Your technician partner session has been ended securely. Thank you for your service.</p>

    <a href="{% url 'technician_login' %}">
        Login Again to Workspace
    </a>
</div>

</body>
</html>
